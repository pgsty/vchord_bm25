name: Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      extended:
        description: "Run extended cross-platform and Valgrind jobs"
        type: boolean
        default: false

env:
  CLANG_NO_DEFAULT_CONFIG: "1"

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  style:
    if: |
      (github.event_name == 'push' && !contains(github.event.head_commit.message, 'job: -style')) ||
      (github.event_name == 'pull_request' && !contains(github.event.pull_request.body, 'job: -style')) ||
      github.event_name == 'workflow_dispatch'

    runs-on: "ubuntu-24.04"

    steps:
      - name: Set up Environment
        run: |
          d=$(mktemp -d)
          curl -fsSL --retry 3 --retry-all-errors -o "$d/taplo.gz" "https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-linux-$(uname -m).gz"
          gzip -d "$d/taplo.gz"
          install -m 755 "$d/taplo" /usr/local/bin/taplo

          curl -fsSL --retry 3 --retry-all-errors -o "$d/cargo-deny.tar.gz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.18.9/cargo-deny-0.18.9-$(uname -m)-unknown-linux-musl.tar.gz"
          tar -xzf "$d/cargo-deny.tar.gz" -C "$d"
          install -m 755 "$d/cargo-deny-0.18.9-$(uname -m)-unknown-linux-musl/cargo-deny" /usr/local/bin/cargo-deny

      - name: Install Rust
        run: rustup update

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Typos
        uses: crate-ci/typos@master

      - name: Taplo
        run: taplo fmt --check

      - name: Rustfmt
        run: cargo fmt --check -- --config-path /dev/null --config imports_granularity=Module

      - name: Deny
        run: cargo deny check

      - name: License Header
        run: |
          HEADER=$(cat <<EOF
          This program is free software: you can redistribute it and/or modify
          it under the terms of the GNU Affero General Public License v3 (AGPLv3).
          See <https://www.gnu.org/licenses/agpl-3.0.html> for details.

          Copyright (c) 2025-2026 TensorChord Inc.
          Copyright (c) 2026 PGSTY PTE. LTD.
          Maintained by Ruohang Feng @ PGSTY (rh@vonng.com)
          EOF
          )
          COUNT=$(echo "$HEADER" | wc -l)

          RS_HEADER=$(echo "$HEADER" | awk '{ if ($0 ~ /^$/) print "//"; else print "// " $0 }')
          C_HEADER=$(echo "$HEADER" | awk '{ if ($0 ~ /^$/) print "//"; else print "// " $0 }')
          PY_HEADER=$(echo "$HEADER" | awk '{ if ($0 ~ /^$/) print "#"; else print "# " $0 }')

          RS_FILES=$(find . -type f -name "*.rs" -not -path "./target/*")
          C_FILES=$(find . -type f -name "*.c" -not -path "./target/*")
          PY_FILES=$(find . -type f -name "*.py" -not -path "./target/*")

          FLAG="0"

          for p in $RS_FILES; do
            if ! head -n "$COUNT" "$p" | cmp -s - <(echo "$RS_HEADER"); then
              echo "license header mismatch in file $p"
              FLAG="1"
            fi
          done

          for p in $C_FILES; do
            if ! head -n "$COUNT" "$p" | cmp -s - <(echo "$C_HEADER"); then
              echo "license header mismatch in file $p"
              FLAG="1"
            fi
          done

          for p in $PY_FILES; do
            if ! head -n "$COUNT" "$p" | cmp -s - <(echo "$PY_HEADER"); then
              echo "license header mismatch in file $p"
              FLAG="1"
            fi
          done

          if [ "$FLAG" -eq "1" ]; then
            exit 1
          fi

      - name: SQL
        run: |
          ! grep -P '\t' -r ./sql

  lint:
    if: |
      (github.event_name == 'push' && !contains(github.event.head_commit.message, 'job: -lint')) ||
      (github.event_name == 'pull_request' && !contains(github.event.pull_request.body, 'job: -lint')) ||
      github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        arch: ["x86_64", "aarch64"]
    runs-on: ${{ matrix.arch == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}

    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTUP_AUTO_INSTALL: "0"
      RUSTC_WRAPPER: "sccache"
      RUSTFLAGS: "-Dwarnings"
      CARGO_TERM_COLOR: "always"
      RUST_BACKTRACE: "1"

    steps:
      - name: Install Rust
        run: rustup update

      - name: Set up Sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cargo Test
        run: cargo test --locked --workspace --exclude vchord_bm25 --no-fail-fast -- --no-capture

      - name: Clippy
        run: cargo clippy --locked --workspace --exclude vchord_bm25

  psql:
    if: |
      (github.event_name == 'push' && !contains(github.event.head_commit.message, 'job: -psql')) ||
      (github.event_name == 'pull_request' && !contains(github.event.pull_request.body, 'job: -psql')) ||
      github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        version: ["15", "16", "17", "18", "19"]
        arch: ["x86_64", "aarch64"]
    runs-on: ${{ matrix.arch == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}

    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTUP_AUTO_INSTALL: "0"
      RUSTC_WRAPPER: "sccache"
      RUSTFLAGS: "-Dwarnings"
      CARGO_TERM_COLOR: "always"
      RUST_BACKTRACE: "1"

    steps:
      - name: Set up Environment
        run: |
          sudo apt-get update

          d=$(mktemp -d)
          curl -fsSL --retry 3 --retry-all-errors -o "$d/sqllogictest.tar.gz" "https://github.com/risinglightdb/sqllogictest-rs/releases/download/v0.29.0/sqllogictest-bin-v0.29.0-$(uname -m)-unknown-linux-musl.tar.gz"
          tar -xzf "$d/sqllogictest.tar.gz" -C "$d" ./sqllogictest
          install -m 755 "$d/sqllogictest" /usr/local/bin/sqllogictest

      - name: Install Rust
        run: rustup update

      - name: Install Clang
        run: |
          d=$(mktemp -d)
          curl --proto '=https' --tlsv1.2 -sSf --retry 3 --retry-all-errors -o "$d/llvm.sh" "https://apt.llvm.org/llvm.sh"
          sudo bash "$d/llvm.sh" 18
          sudo apt-get install -y --no-install-recommends llvm-18 libclang-18-dev
          echo CC=clang-18 >> $GITHUB_ENV
          echo CLANG_PATH=/usr/bin/clang-18 >> $GITHUB_ENV
          echo LIBCLANG_PATH=/usr/lib/llvm-18/lib >> $GITHUB_ENV

      - name: Set up Sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Install PostgreSQL
        run: |
          sudo apt-get remove -y '^postgres.*' '^libpq.*'
          sudo apt-get purge -y '^postgres.*' '^libpq.*'

          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-server-dev-${{ matrix.version }}
          sudo apt-get install -y --no-install-recommends postgresql-${{ matrix.version }}

          echo "local all all trust" | sudo tee /etc/postgresql/${{ matrix.version }}/main/pg_hba.conf
          echo "host all all 127.0.0.1/32 trust" | sudo tee -a /etc/postgresql/${{ matrix.version }}/main/pg_hba.conf
          echo "host all all ::1/128 trust" | sudo tee -a /etc/postgresql/${{ matrix.version }}/main/pg_hba.conf

          sudo mkdir -p /etc/systemd/system/postgresql@.service.d/
          echo "[Service]" | sudo tee /etc/systemd/system/postgresql@.service.d/limit.conf
          echo "LimitNOFILE=infinity" | sudo tee -a /etc/systemd/system/postgresql@.service.d/limit.conf
          echo "LimitMEMLOCK=infinity" | sudo tee -a /etc/systemd/system/postgresql@.service.d/limit.conf
          sudo systemctl daemon-reload

          sudo -iu postgres createuser -s -r $(whoami)
          sudo -iu postgres createdb -O $(whoami) $(whoami)
          if [ "${{ matrix.version }}" -ge "18" ]; then
            psql -c 'ALTER SYSTEM SET io_method = io_uring'
          fi
          psql -c 'ALTER SYSTEM SET max_worker_processes = 1024'
          psql -c 'ALTER SYSTEM SET shared_preload_libraries = vchord_bm25'
          sudo systemctl stop postgresql

          pg_config
          echo PG_CONFIG=pg_config >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Clippy
        run: make PROFILE=dev clippy

      - name: Build
        run: make PROFILE=dev build

      - name: Install
        run: sudo make PG_CONFIG=$PG_CONFIG install

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgresql-${{ matrix.version }}-vchord-bm25_1.2.0_${{ matrix.arch }}-linux-gnu
          path: ./build
          compression-level: 9
          retention-days: 14

      - name: Service
        run: |
          sudo systemctl start postgresql
          psql -c 'CREATE EXTENSION IF NOT EXISTS vchord_bm25 CASCADE;'

      - name: Sqllogictest
        run: |
          sqllogictest --db $(whoami) --user $(whoami) './tests/sqllogictest/*.slt'

      # Every C symbol referenced by supported 1.0.0+ SQL scripts must remain
      # exported, and upgrading from 1.0.0 or 1.1.0 must preserve indexes and
      # match a fresh 1.2.0 installation.
      - name: Extension scripts
        run: |
          ./devtools/check-symbols.sh "$($PG_CONFIG --pkglibdir)/vchord_bm25.so"
          if ! grep -q "^default_version = '0.0.0'$" vchord_bm25.control; then
            for version in 1.0.0 1.1.0; do
              sudo install -m 644 "sql/install/vchord_bm25--$version.sql" "$($PG_CONFIG --sharedir)/extension/"
              ./devtools/check-upgrade.sh "$version"
            done
          fi

      - name: Concurrent VACUUM
        run: |
          rustup toolchain install nightly
          ./tests/concurrent_vacuum "user=$(whoami) dbname=$(whoami) host=localhost"

      - name: Storage and recovery acceptance
        if: matrix.version == '18' || matrix.version == '19'
        run: |
          sudo apt-get install -y python3-venv
          python3 -m venv /tmp/bm25-acceptance-venv
          /tmp/bm25-acceptance-venv/bin/pip install 'psycopg[binary]>=3,<4'
          /tmp/bm25-acceptance-venv/bin/python tests/acceptance.py --pg-config "$PG_CONFIG" --recovery

      - name: Fuzz
        run: |
          ./tests/fuzz "user=$(whoami) dbname=$(whoami) host=localhost" $(nproc)

      - name: Logging
        if: always()
        run: |
          sudo cat /var/log/postgresql/postgresql-${{ matrix.version }}-main.log

      # Crashes, assertion failures and resource leaks do not always fail SQL
      # tests (a backend restarts, a leak is only a WARNING), so fail on them here.
      - name: Server log check
        run: |
          sudo test -f /var/log/postgresql/postgresql-${{ matrix.version }}-main.log
          ! sudo grep -nE 'TRAP:|PANIC:|terminated by signal|was not closed|reference leak|refcount leak|not owned by resource owner|after release started' /var/log/postgresql/postgresql-${{ matrix.version }}-main.log

  psql_macos:
    if: |
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'job: +psql_macos')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.body, 'job: +psql_macos')) ||
      (github.event_name == 'workflow_dispatch' && inputs.extended)

    strategy:
      fail-fast: false
      matrix:
        version: ["15", "16", "17", "18", "19"]
        arch: ["aarch64"]

    runs-on: "macos-15"

    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      SCCACHE_GHA_ENABLED: "true"
      RUSTUP_AUTO_INSTALL: "0"
      RUSTC_WRAPPER: "sccache"
      RUSTFLAGS: "-Dwarnings"
      CARGO_TERM_COLOR: "always"
      RUST_BACKTRACE: "1"

    steps:
      - name: Set up Environment
        run: |
          d=$(mktemp -d)
          curl -fsSL --retry 3 --retry-all-errors -o "$d/sqllogictest.tar.gz" "https://github.com/risinglightdb/sqllogictest-rs/releases/download/v0.29.0/sqllogictest-bin-v0.29.0-${{ matrix.arch }}-apple-darwin.tar.gz"
          tar -xzf "$d/sqllogictest.tar.gz" -C "$d" ./sqllogictest
          install -m 755 "$d/sqllogictest" /usr/local/bin/sqllogictest

      - name: Install Rust
        run: rustup update

      - name: Install Clang
        run: |
          if [ ! -x "$(brew --prefix llvm@18)/bin/clang" ]; then
            brew install llvm@18
          fi
          echo CC=$(brew --prefix llvm@18)/bin/clang >> $GITHUB_ENV
          echo CLANG_PATH=$(brew --prefix llvm@18)/bin/clang >> $GITHUB_ENV
          echo LIBCLANG_PATH=$(brew --prefix llvm@18)/lib >> $GITHUB_ENV

      - name: Set up Sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        with:
          version: "v0.12.0"

      - name: Install PostgreSQL
        run: |
          case "${{ matrix.version }}" in
            15) pg_version=15.20 ;;
            16) pg_version=16.16 ;;
            17) pg_version=17.12 ;;
            18) pg_version=18.7 ;;
            19) pg_version=19.0 ;;
            *) exit 1 ;;
          esac
          mkdir ~/postgresql-install
          curl -fsSL --retry 3 "https://ftp.postgresql.org/pub/source/v$pg_version/postgresql-$pg_version.tar.bz2" | tar -xj -C ~/postgresql-install
          pushd ~/postgresql-install/postgresql-$pg_version
          ./configure --prefix="$RUNNER_TEMP/postgresql" --enable-cassert --without-icu --without-readline --without-zlib
          make -j$(sysctl -n hw.ncpu)
          make install
          popd
          PG_CONFIG="$RUNNER_TEMP/postgresql/bin/pg_config"
          "$PG_CONFIG"
          echo "PG_CONFIG=$PG_CONFIG" >> $GITHUB_ENV
          pg_bindir="$("$PG_CONFIG" --bindir)"
          echo "$pg_bindir" >> $GITHUB_PATH
          "$pg_bindir/initdb" -D "$RUNNER_TEMP/vchord_bm25-pgdata" -A trust
          echo 'max_worker_processes = 1024' >> "$RUNNER_TEMP/vchord_bm25-pgdata/postgresql.conf"
          echo "shared_preload_libraries = 'vchord_bm25'" >> "$RUNNER_TEMP/vchord_bm25-pgdata/postgresql.conf"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Clippy
        run: make PROFILE=dev clippy

      - name: Build
        run: make PROFILE=dev build

      - name: Install
        run: sudo make PG_CONFIG=$PG_CONFIG install

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgresql-${{ matrix.version }}-vchord-bm25_1.2.0_${{ matrix.arch }}-apple-darwin
          path: ./build
          compression-level: 9
          retention-days: 14

      - name: Service
        run: |
          pg_ctl -D "$RUNNER_TEMP/vchord_bm25-pgdata" -l "$RUNNER_TEMP/vchord_bm25-postgresql.log" -w start
          createdb -O $(whoami) $(whoami)
          psql -c 'CREATE EXTENSION IF NOT EXISTS vchord_bm25 CASCADE;'

      - name: Sqllogictest
        run: |
          sqllogictest --db $(whoami) --user $(whoami) './tests/sqllogictest/*.slt'

      - name: Logging
        if: always()
        run: |
          cat "$RUNNER_TEMP/vchord_bm25-postgresql.log"

      - name: Server log check
        run: |
          test -f "$RUNNER_TEMP/vchord_bm25-postgresql.log"
          ! grep -nE 'TRAP:|PANIC:|terminated by signal|was not closed|reference leak|refcount leak|not owned by resource owner|after release started' "$RUNNER_TEMP/vchord_bm25-postgresql.log"

      - name: Stop PostgreSQL
        if: always()
        run: pg_ctl -D "$RUNNER_TEMP/vchord_bm25-pgdata" -m fast -w stop

  psql_windows:
    if: |
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'job: +psql_windows')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.body, 'job: +psql_windows')) ||
      (github.event_name == 'workflow_dispatch' && inputs.extended)

    strategy:
      fail-fast: false
      matrix:
        version: ["15", "16", "17", "18", "19"]
        arch: ["x86_64"]

    runs-on: "windows-2022"

    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTUP_AUTO_INSTALL: "0"
      RUSTC_WRAPPER: "sccache"
      RUSTFLAGS: "-Dwarnings"
      CARGO_TERM_COLOR: "always"
      RUST_BACKTRACE: "1"

    steps:
      - name: Set up Environment
        run: |
          Invoke-WebRequest -Uri https://github.com/risinglightdb/sqllogictest-rs/releases/download/v0.29.0/sqllogictest-bin-v0.29.0-${{ matrix.arch }}-pc-windows-msvc.zip -OutFile "$env:TEMP\sqllogictest-install.zip"
          Expand-Archive -Path "$env:TEMP\sqllogictest-install.zip" -DestinationPath "D:\sqllogictest-install" -Force
          Add-Content -Path $env:GITHUB_PATH -Value "D:\sqllogictest-install"

      - name: Install Rust
        run: rustup update

      - name: Set up Sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Install PostgreSQL
        run: |
          'PGBIN','PGDATA','PGROOT', 'PGUSER', 'PGPASSWORD' | ForEach-Object { Remove-Item "env:$_" }

          if ( "${{ matrix.version }}" -eq "15" ) {
            $postgresql_url = "https://get.enterprisedb.com/postgresql/postgresql-15.15-2-windows-x64-binaries.zip"
          }
          if ( "${{ matrix.version }}" -eq "16" ) {
            $postgresql_url = "https://get.enterprisedb.com/postgresql/postgresql-16.11-2-windows-x64-binaries.zip"
          }
          if ( "${{ matrix.version }}" -eq "17" ) {
            $postgresql_url = "https://get.enterprisedb.com/postgresql/postgresql-17.7-2-windows-x64-binaries.zip"
          }
          if ( "${{ matrix.version }}" -eq "18" ) {
            $postgresql_url = "https://get.enterprisedb.com/postgresql/postgresql-18.1-2-windows-x64-binaries.zip"
          }
          if ( "${{ matrix.version }}" -eq "19" ) {
            $postgresql_url = "https://get.enterprisedb.com/postgresql/postgresql-19.0-1-windows-x64-binaries.zip"
          }
          Invoke-WebRequest -Uri $postgresql_url -OutFile "$env:TEMP\postgresql-install.zip"
          Expand-Archive -Path "$env:TEMP\postgresql-install.zip" -DestinationPath "D:\postgresql-install" -Force
          D:\postgresql-install\pgsql\bin\initdb.exe -D D:\postgresql-install\pgsql\data -U postgres

          D:\postgresql-install\pgsql\bin\pg_ctl.exe start -D D:\postgresql-install\pgsql\data -l D:\postgresql-install\postgresql.log

          D:\postgresql-install\pgsql\bin\createuser.exe -U postgres -s -r $env:USERNAME
          D:\postgresql-install\pgsql\bin\createdb.exe -O $env:USERNAME $env:USERNAME
          D:\postgresql-install\pgsql\bin\psql.exe -c 'ALTER SYSTEM SET max_worker_processes = 1024'
          D:\postgresql-install\pgsql\bin\psql.exe -c 'ALTER SYSTEM SET shared_preload_libraries = "vchord_bm25"'
          D:\postgresql-install\pgsql\bin\pg_ctl.exe stop -D D:\postgresql-install\pgsql\data

          D:\postgresql-install\pgsql\bin\pg_config.exe
          Add-Content -Path $env:GITHUB_ENV -Value "PG_CONFIG=D:\postgresql-install\pgsql\bin\pg_config.exe"

      - name: Install Clang
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "CC=clang-cl.exe"
          $clang_bin = Split-Path (Get-Command clang.exe).Source
          Add-Content -Path $env:GITHUB_ENV -Value "CLANG_PATH=$clang_bin\clang.exe"
          Add-Content -Path $env:GITHUB_ENV -Value "LIBCLANG_PATH=$clang_bin"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Clippy
        run: make PROFILE=dev clippy

      - name: Build
        run: make PROFILE=dev build

      - name: Install
        run: make install

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgresql-${{ matrix.version }}-vchord-bm25_1.2.0_${{ matrix.arch }}-pc-windows-msvc
          path: ./build
          compression-level: 9
          retention-days: 14

      - name: Service
        run: |
          'PGBIN','PGDATA','PGROOT', 'PGUSER', 'PGPASSWORD' | ForEach-Object { Remove-Item "env:$_" }

          D:\postgresql-install\pgsql\bin\pg_ctl.exe start -D D:\postgresql-install\pgsql\data -l D:\postgresql-install\postgresql.log
          D:\postgresql-install\pgsql\bin\psql.exe -c 'CREATE EXTENSION IF NOT EXISTS vchord_bm25 CASCADE;'

      - name: Sqllogictest
        run: |
          sqllogictest --db $env:USERNAME --user $env:USERNAME './tests/sqllogictest/*.slt' --label windows

      - name: Logging
        if: always()
        run: |
          Get-Content -Path 'D:\postgresql-install\postgresql.log'

  psql_alpine:
    if: |
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'job: +psql_alpine')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.body, 'job: +psql_alpine')) ||
      (github.event_name == 'workflow_dispatch' && inputs.extended)

    strategy:
      fail-fast: false
      matrix:
        version: ["15", "16", "17"]
        arch: ["x86_64", "aarch64"]
    runs-on: ${{ matrix.arch == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    container:
      image: alpine:3.22
      volumes:
        - /opt:/opt:rw,rshared
        - /opt:/__e/node20:ro,rshared
        - /opt:/__e/node24:ro,rshared

    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTUP_AUTO_INSTALL: "0"
      RUSTC_WRAPPER: "sccache"
      # RUSTFLAGS: "-Dwarnings"
      CARGO_TERM_COLOR: "always"
      RUST_BACKTRACE: "1"

    steps:
      - name: Set up Environment
        run: |
          sed -i "/^ID=/s/alpine/NotpineForGHA/" /etc/os-release
          apk add --update-cache curl git make nodejs sudo zip
          mkdir /opt/bin
          ln -s /usr/bin/node /opt/bin/node

          d=$(mktemp -d)
          curl -fsSL --retry 3 --retry-all-errors -o "$d/sqllogictest.tar.gz" "https://github.com/risinglightdb/sqllogictest-rs/releases/download/v0.29.0/sqllogictest-bin-v0.29.0-$(uname -m)-unknown-linux-musl.tar.gz"
          tar -xzf "$d/sqllogictest.tar.gz" -C "$d" ./sqllogictest
          install -m 755 "$d/sqllogictest" /usr/local/bin/sqllogictest

      - name: Install Rust
        run: |
          d=$(mktemp -d)
          curl --proto '=https' --tlsv1.2 -sSf --retry 3 --retry-all-errors -o "$d/rustup-init.sh" "https://sh.rustup.rs"
          sh "$d/rustup-init.sh" -y --default-toolchain beta
          echo $HOME/.cargo/bin >> $GITHUB_PATH
          echo RUSTC_BOOTSTRAP=1 >> $GITHUB_ENV

      - name: Install Clang
        run: |
          sudo apk add --no-cache clang18 clang18-dev llvm18
          echo CC=clang-18 >> $GITHUB_ENV
          echo CLANG_PATH=/usr/bin/clang-18 >> $GITHUB_ENV
          echo LIBCLANG_PATH=/usr/lib/llvm18/lib >> $GITHUB_ENV

      - name: Set up Sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Install PostgreSQL
        run: |
          sudo apk add --no-cache postgresql${{ matrix.version }} postgresql${{ matrix.version }}-dev
          sudo touch /var/log/postgresql.log
          sudo chmod 644 /var/log/postgresql.log
          sudo chown postgres /var/log/postgresql.log
          sudo install --verbose --directory --owner postgres --group postgres --mode 1777 /var/lib/postgresql
          sudo install --verbose --directory --owner postgres --group postgres --mode 1777 /var/lib/postgresql/data
          sudo install --verbose --directory --owner postgres --group postgres --mode 3777 /run/postgresql
          sudo -iu postgres initdb -D /var/lib/postgresql/data

          sudo -iu postgres pg_ctl start -D /var/lib/postgresql/data -l /var/log/postgresql.log

          sudo -iu postgres createuser -s -r $(whoami)
          sudo -iu postgres createdb -O $(whoami) $(whoami)
          if [ "${{ matrix.version }}" -ge "18" ]; then
            psql -c 'ALTER SYSTEM SET io_method = io_uring'
          fi
          psql -c 'ALTER SYSTEM SET max_worker_processes = 1024'
          psql -c 'ALTER SYSTEM SET shared_preload_libraries = "vchord_bm25"'
          sudo -iu postgres pg_ctl stop -D /var/lib/postgresql/data

          /usr/libexec/postgresql${{ matrix.version }}/pg_config
          echo PG_CONFIG=/usr/libexec/postgresql${{ matrix.version }}/pg_config >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Patch
        run: |
          mkdir ./.cargo && touch ./.cargo/config.toml
          cat << EOF > ./.cargo/config.toml
          unstable.host-config = true
          unstable.target-applies-to-host = true
          host.rustflags = ["-Dwarnings", "-Ctarget-feature=-crt-static"]
          build.rustflags = ["-Dwarnings", "-Ctarget-feature=-crt-static"]
          EOF

      - name: Clippy
        run: make PROFILE=dev clippy

      - name: Build
        run: make PROFILE=dev build

      - name: Install
        run: sudo make PG_CONFIG=$PG_CONFIG install

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgresql-${{ matrix.version }}-vchord-bm25_1.2.0_${{ matrix.arch }}-linux-musl
          path: ./build
          compression-level: 9
          retention-days: 14

      - name: Service
        run: |
          sudo -iu postgres pg_ctl start -D /var/lib/postgresql/data -l /var/log/postgresql.log
          psql -c 'CREATE EXTENSION IF NOT EXISTS vchord_bm25 CASCADE;'

      - name: Sqllogictest
        run: |
          sqllogictest --db $(whoami) --user $(whoami) './tests/sqllogictest/*.slt'

      - name: Logging
        if: always()
        run: |
          cat /var/log/postgresql.log

  check_arch:
    if: |
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'job: +check_arch')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.body, 'job: +check_arch')) ||
      (github.event_name == 'workflow_dispatch' && inputs.extended)

    strategy:
      fail-fast: false
      matrix:
        version: ["17", "18", "19"]

    runs-on: "ubuntu-24.04"

    container:
      image: archlinux/archlinux:base-devel
      volumes:
        - /etc/passwd:/etc/passwd:rw,rshared
        - /etc/group:/etc/group:rw,rshared
        - /etc/shadow:/etc/shadow:rw,rshared
        - /etc/gshadow:/etc/gshadow:rw,rshared
        - /etc/sudoers.d/runner:/etc/sudoers.d/runner:rw,rshared
      options: --user 1001 --privileged

    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTUP_AUTO_INSTALL: "0"
      RUSTC_WRAPPER: "sccache"
      RUSTFLAGS: "-Dwarnings"
      CARGO_TERM_COLOR: "always"
      RUST_BACKTRACE: "1"

    steps:
      - name: Set up Environment
        run: |
          sudo sed -i 's/^DownloadUser = alpm$/DownloadUser = runner/' /etc/pacman.conf
          sudo pacman -Syu --ignore systemd,systemd-libs,systemd-sysvcompat --noconfirm git nodejs
          sudo mkdir -p /var/lib/postgresql
          sudo chmod 700 /var/lib/postgresql
          sudo chown postgres:postgres /var/lib/postgresql

          sudo pacman -S --noconfirm liburing numactl python valgrind

          d=$(mktemp -d)
          curl -fsSL --retry 3 --retry-all-errors -o "$d/sqllogictest.tar.gz" "https://github.com/risinglightdb/sqllogictest-rs/releases/download/v0.29.0/sqllogictest-bin-v0.29.0-$(uname -m)-unknown-linux-musl.tar.gz"
          tar -xzf "$d/sqllogictest.tar.gz" -C "$d" ./sqllogictest
          sudo install -m 755 "$d/sqllogictest" /usr/local/bin/sqllogictest

      - name: Install Rust
        run: |
          d=$(mktemp -d)
          curl --proto '=https' --tlsv1.2 -sSf --retry 3 --retry-all-errors -o "$d/rustup-init.sh" "https://sh.rustup.rs"
          sh "$d/rustup-init.sh" -y --default-toolchain beta
          echo $HOME/.cargo/bin >> $GITHUB_PATH
          echo RUSTC_BOOTSTRAP=1 >> $GITHUB_ENV

      - name: Install Clang
        run: |
          sudo pacman -S --noconfirm clang llvm
          echo CC=clang >> $GITHUB_ENV

      - name: Set up Sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Install PostgreSQL
        run: |
          mkdir ~/postgresql-install
          if [ "${{ matrix.version }}" = "17" ]; then
            curl -fsSL https://ftp.postgresql.org/pub/source/v17.6/postgresql-17.6.tar.bz2 | tar -xj -C ~/postgresql-install
            pushd ~/postgresql-install/postgresql-17.6
          fi
          if [ "${{ matrix.version }}" = "18" ]; then
            curl -fsSL https://ftp.postgresql.org/pub/source/v18.0/postgresql-18.0.tar.bz2 | tar -xj -C ~/postgresql-install
            pushd ~/postgresql-install/postgresql-18.0
          fi
          if [ "${{ matrix.version }}" = "19" ]; then
            curl -fsSL https://ftp.postgresql.org/pub/source/v19.0/postgresql-19.0.tar.bz2 | tar -xj -C ~/postgresql-install
            pushd ~/postgresql-install/postgresql-19.0
          fi
          ./configure \
              --prefix=/usr \
              --sysconfdir=/etc \
              --mandir=/usr/share/man \
              --datadir=/usr/share/postgresql \
              --disable-rpath \
              --enable-nls \
              --with-gssapi \
              --with-icu \
              --with-ldap \
              --with-lz4 \
              --with-openssl \
              --with-python \
              --with-readline \
              --with-system-tzdata=/usr/share/zoneinfo \
              --with-uuid=e2fs \
              --with-zstd \
              ${{ matrix.version >= 18 && '--with-libcurl'  || '' }} \
              ${{ matrix.version >= 18 && '--with-libnuma'  || '' }} \
              ${{ matrix.version >= 18 && '--with-liburing' || '' }} \
              --enable-debug \
              --enable-cassert \
              CC='sccache clang' \
              CFLAGS='-O0 -g -fno-omit-frame-pointer -mno-omit-leaf-frame-pointer -fasynchronous-unwind-tables' \
              CPPFLAGS='-DUSE_ASSERT_CHECKING=1 -DRANDOMIZE_ALLOCATED_MEMORY=1 -DUSE_VALGRIND=1'
          make all -j$(nproc)
          sudo make install
          popd

          sudo touch /usr/bin/postmaster
          echo '#!/usr/bin/sh' | sudo tee -a /usr/bin/postmaster
          echo 'export DEBUGINFOD_URLS=https://debuginfod.archlinux.org' | sudo tee -a /usr/bin/postmaster
          echo 'exec \' | sudo tee -a /usr/bin/postmaster
          echo '  valgrind \' | sudo tee -a /usr/bin/postmaster
          echo '  --leak-check=no \' | sudo tee -a /usr/bin/postmaster
          echo '  --gen-suppressions=all \' | sudo tee -a /usr/bin/postmaster
          echo '  --time-stamp=yes \' | sudo tee -a /usr/bin/postmaster
          echo '  --error-markers=VALGRINDERROR-BEGIN,VALGRINDERROR-END \' | sudo tee -a /usr/bin/postmaster
          echo '  --trace-children=yes \' | sudo tee -a /usr/bin/postmaster
          echo '  /usr/bin/postgres "$@"' | sudo tee -a /usr/bin/postmaster
          sudo chmod 755 /usr/bin/postmaster
          sudo mkdir -p /var/lib/postgres
          sudo chmod 700 /var/lib/postgres
          sudo chown postgres:postgres /var/lib/postgres
          sudo touch /var/log/postgresql.log
          sudo chmod 700 /var/log/postgresql.log
          sudo chown postgres:postgres /var/log/postgresql.log
          sudo -iu postgres initdb -D /var/lib/postgres/data
          sudo -iu postgres pg_ctl start -D /var/lib/postgres/data -l /var/log/postgresql.log -p /usr/bin/postmaster

          sudo -iu postgres createuser -s -r $(whoami)
          sudo -iu postgres createdb -O $(whoami) $(whoami)
          if [ "${{ matrix.version }}" -ge "18" ]; then
            # valgrind works not well
            sudo -iu postgres psql -c 'ALTER SYSTEM SET io_method = worker'
          fi
          sudo -iu postgres psql -c 'ALTER SYSTEM SET max_worker_processes = 1024'
          sudo -iu postgres psql -c 'ALTER SYSTEM SET shared_preload_libraries = "vchord_bm25"'
          sudo -iu postgres pg_ctl stop -D /var/lib/postgres/data

          pg_config
          echo PG_CONFIG=pg_config >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cargo Test
        run: cargo test --locked --workspace --exclude vchord_bm25 --no-fail-fast -- --no-capture

      - name: Clippy
        run: make PROFILE=dev clippy

      - name: Build
        run: make PROFILE=dev build

      - name: Install
        run: sudo make PG_CONFIG=$PG_CONFIG install

      - name: Service
        run: |
          sudo -iu postgres pg_ctl start -D /var/lib/postgres/data -l /var/log/postgresql.log -p /usr/bin/postmaster
          psql -c 'CREATE EXTENSION IF NOT EXISTS vchord_bm25 CASCADE;'

      - name: Sqllogictest
        run: |
          sqllogictest --db $(whoami) --user $(whoami) './tests/sqllogictest/*.slt' --label pg${{ matrix.version }}

      - name: Logging
        if: always()
        run: |
          sudo cat /var/log/postgresql.log
